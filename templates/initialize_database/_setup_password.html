{% load i18n %}
<div class="ks-password">
    <input type="password" id="{{ field_id }}" name="{{ field_name }}" autocomplete="{{ field_autocomplete }}"{% if description_id %} aria-describedby="{{ description_id }}"{% endif %} required>
    <button type="button" class="ks-password__toggle" data-setup-password aria-controls="{{ field_id }}" aria-pressed="false" aria-label="{% trans 'Show password' %}" data-show-label="{% trans 'Show password' %}" data-hide-label="{% trans 'Hide password' %}" data-show="{% trans 'Show' %}" data-hide="{% trans 'Hide' %}">{% trans "Show" %}</button>
</div>
