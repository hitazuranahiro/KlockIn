events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Defence in depth for credential stuffing. django-axes locks a given
    # (username, IP) pair after AXES_FAILURE_LIMIT failures, but every one of
    # those attempts still costs a request, a database lookup and a password
    # hash. This caps the rate before any of that happens.
    #
    # 10m holds roughly 160k addresses. burst=10 nodelay lets a genuine user
    # who fat-fingers their password a few times through without a delay, then
    # throttles anything sustained beyond that.
    #
    # Only POSTs (the login attempts) count. Showing the form costs no lookup
    # or hash, and counting GETs locked people out: a dashboard left open past
    # session expiry sends its ~10 data requests to /login/ at once, using up
    # the burst, so the login page itself then returned 429. An empty key is
    # never limited, so GETs here are as unlimited as every other page.
    map $request_method $klockin_login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $klockin_login_limit_key zone=klockin_login:10m rate=5r/m;
    limit_req_status 429;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/klockin-tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/klockin-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 50M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # /media/ is intentionally NOT served directly by nginx. Every file under
        # it requires Django's own per-request checks -- authentication (or a
        # valid JWT) and the content-type gate that forces uploaded HTML/SVG/XML/JS
        # to download instead of rendering inline. Serving it here via `alias`
        # would bypass both checks entirely, regardless of what Django itself
        # enforces in base/views.py:protected_media(). Requests fall through to
        # the proxy below instead.

        # Credential endpoints retain their dedicated request rate limit.
        location ~ ^/(login|api(/v1)?/auth/login)/?$ {
            limit_req zone=klockin_login burst=10 nodelay;
            proxy_pass http://django;
        }

        location ^~ /api/v2/attendance/ {
            client_max_body_size 15M;
            proxy_pass http://django;
        }

        # Operational metrics: job counts and failure rates. Django also
        # requires staff for this, but defence in depth -- `location /` would
        # otherwise proxy it straight through to the internet. Scrape it from
        # inside the network, against the web container directly.
        location /metrics/ {
            deny all;
        }

        location / {
            proxy_pass http://django;
        }
    }
}
